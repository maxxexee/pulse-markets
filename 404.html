<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Not found — PULSE</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c0e;
        --line: #23262b;
        --text: #e8eaed;
        --muted: #8b9099;
        --accent: #5eead4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 460px; }
      h1 {
        margin: 0 0 14px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      p { margin: 0 0 22px; }
      code {
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 13px;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }
      a:hover { border-bottom-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>404 — nothing here</h1>
      <p>
        This address is not part of the site. Published epochs live under
        <code>/api/index/snapshot/&lt;day&gt;</code>; everything else is a page that
        has to exist as a file.
      </p>
      <p>
        <a href="/">The index</a> &middot; <a href="/app/">Overview</a> &middot;
        <a href="/markets.html">Markets</a>
      </p>
    </main>
  </body>
</html>
